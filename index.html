<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>הזמנה - מיכלי זהב</title><style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial;background:#0f0f1a;color:#f0ead6;margin:0;padding:0 0 100px;-webkit-text-size-adjust:100%}header{text-align:center;padding:18px;background:#16213e;border-bottom:2px solid #c9a84c}.w{padding:10px}.row{display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:10px;background:#16213e;border:1px solid #2a3f60;border-radius:10px;padding:9px 12px;margin-bottom:7px;direction:rtl}.row span{flex:1;text-align:right;direction:rtl}.gap{height:18px}.q{display:flex;direction:rtl;flex:0 0 auto}.q button,.q input{width:36px;height:34px;background:#0f0f1a;color:#f0ead6;border:0;text-align:center}textarea{width:100%;min-height:70px;background:#16213e;color:#fff;border:1px solid #2a3f60;border-radius:10px;padding:10px}.warn{text-align:center;color:#e8c97a;font-weight:700;margin:12px 0}footer{position:fixed;bottom:0;left:0;right:0;background:#0f0f1a;border-top:2px solid #c9a84c;padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center}.send{padding:0 18px;height:42px;border:0;background:#25D366;color:#fff;border-radius:10px}</style></head><body><header><h1>מיכלי זהב</h1></header><div class="w" id="list"></div><footer><div><b id="count">0</b> פריטים</div><button class="send" onclick="sendOrder()">שלח הזמנה</button></footer><script>const PHONE='972544274897',RET='‼️*לידע נהג לקח החזרות*‼️',RLM='\u200F',LRM='\u200E';const G=[['מגש מובנה 25/35 לבן','מגש מובנה 25/35 שחור','מכסה 25/35 שקוף','חבק לבן','חבק שחור'],['חצי מגש מובנה לבן','חצי מגש מובנה שחור','מכסה חצי'],['מגש ג׳מבו נעילות לבן','מגש ג׳מבו שחור','מכסה לג׳מבו נעילות'],['מגש חצי ג׳מבו לבן','מגש חצי ג׳מבו שחור','מכסה חצי ג׳מבו'],['צנצנת 280','צנצנת 500','צנצנת 750','צנצנת 900','מכסה לצנצנת שחור'],['מגש סושי מסיבה','מכסה מסיבה'],['קריסטלית 50','עטרת טוליפ חום 1500 י״ח','שקיות דליה 32/19/25 לבן'],[RET]];const L=document.getElementById('list');G.forEach((g,gi)=>{if(gi)L.insertAdjacentHTML('beforeend','<div class="gap"></div>');g.forEach(p=>{const r=document.createElement('div');r.className='row';r.dataset.group=gi;r.innerHTML='<span></span><div class="q"><button onclick="chg(this,-1)">−</button><input type="number" min="0" value="0" inputmode="numeric"><button onclick="chg(this,1)">+</button></div>';r.querySelector('span').textContent=p;r.querySelector('input').oninput=refresh;L.appendChild(r)})});L.insertAdjacentHTML('beforeend','<textarea id="notes" placeholder="הערות להזמנה..."></textarea><div class="warn">‼️ דווח חוסרים בהקדם האפשרי ‼️</div>');function chg(b,d){const i=b.parentElement.querySelector('input');i.value=Math.max(0,(parseInt(i.value)||0)+d);refresh()}function refresh(){let t=0;document.querySelectorAll('.row input').forEach(i=>t+=parseInt(i.value)||0);count.textContent=t}function orderLine(name,q){return RLM+'• '+name+RLM+': '+LRM+'*'+q+'*'+RLM}function sendOrder(){const lines=['🛒 *הזמנה - מיכלי זהב*','📅 '+new Date().toLocaleDateString('he-IL'),'─────────────────'];let total=0;G.forEach((g,gi)=>{const sel=[];document.querySelectorAll('.row[data-group="'+gi+'"]').forEach(r=>{const q=parseInt(r.querySelector('input').value)||0;if(q>0){sel.push(orderLine(r.querySelector('span').textContent,q));total+=q}});if(sel.length)lines.push('',...sel)});if(!total){alert('לא נבחרו פריטים');return}const n=notes.value.trim();if(n)lines.push('','📝 *הערות:* '+n);lines.push('','─────────────────','✅ סה״כ: *'+total+' פריטים*','','‼️ *דווח חוסרים בהקדם האפשרי* ‼️','','*אשר*');const msg=lines.map(x=>RLM+x+RLM).join('\n');location.href='https://wa.me/'+PHONE+'?text='+encodeURIComponent(msg)}</script></body></html>
